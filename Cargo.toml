[workspace]
resolver = "2"
members = [
    "crates/contract",
    "crates/sim",
    "crates/server",
    "crates/replay",
    "crates/bots",
    "tools/params-check",
    "tools/schema-check",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
toml = "1.1"
blake3 = "1"
